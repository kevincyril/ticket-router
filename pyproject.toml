[project]
name = "ticket-router"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5,<7", "rq>=2.6,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2",
  "scipy>=1.14,<2", "pandas>=2.2,<3", "httpx>=0.28,<1", "psutil>=6,<8"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "playwright>=1.50,<2"]
ml = ["torch>=2.6,<3", "transformers>=4.48,<5", "huggingface-hub>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Redis", "browser: requires running app and Chromium"]
